server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Güvenlik başlıkları: satır içi betik yok (XSS), çerçeveleme yok (clickjacking), MIME tahmini yok
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Talep ekleri en fazla 5 MB (API ayrıca kontrol eder)
    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # /api isteklerini .NET API konteynerine yönlendir (reverse proxy) → tarayıcı için tek origin, CORS gerekmez.
    # OAuth 2.0 uçları da API'ye gider (aynı origin → refresh cookie SameSite=Strict ile çalışır)
    location ~ ^/(connect|\.well-known)/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Anlık bildirimler (SignalR WebSocket). Token sorgu dizesinde taşındığı için bu yolda erişim logu tutulmaz.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        access_log off;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Derlenmiş dosyalar içerik özetli (hash) isimlere sahip → uzun süre önbelleklenebilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: bilinmeyen tüm yolları index.html'e düşür (React Router yönetir).
    # index.html önbelleğe alınmaz (expires -1 → Cache-Control: no-cache): yeni sürüm yayınlanınca tarayıcı eski
    # sayfayı göstermez. add_header yerine expires kullanıldı; böylece üstteki güvenlik başlıkları korunur.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
