server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # /api isteklerini .NET API konteynerine yönlendir (reverse proxy) → tarayıcı için tek origin, CORS gerekmez.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Derlenmiş dosyalar içerik özetli (hash) isimlere sahip → uzun süre önbelleklenebilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: bilinmeyen tüm yolları index.html'e düşür (React Router yönetir).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
